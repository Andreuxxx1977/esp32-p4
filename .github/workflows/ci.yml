name: Design checks

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design:
    name: Spec, netlist, docs and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: pip install --use-pep517 -r requirements.txt

      - name: Validate the design data (pin conflicts, strapping, keep-outs)
        run: python -m hardware.lib.board_spec

      - name: Generated docs and BOM are up to date
        run: python -m tools.gen_docs --check

      - name: Committed netlist matches the spec
        run: python -m hardware.skidl.verify_netlist

      - name: Regenerate the netlist with SKiDL (ERC must be clean) and verify it
        run: |
          python -m hardware.skidl.esp32p4_extreme_netlist --out "$RUNNER_TEMP/net"
          python -m hardware.skidl.verify_netlist \
            --net "$RUNNER_TEMP/net/esp32p4_extreme.net" \
            --csv "$RUNNER_TEMP/net/esp32p4_extreme_nets.csv"

      - name: Unit tests
        run: python -m pytest -q

  kicad:
    name: KiCad 10 (pcbnew API, DRC, render, centroid)
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only used on main, to publish the renders branch
    container:
      image: kicad/kicad:10.0
      # The image's default user (uid 1000) cannot write the runner workspace.
      options: --user root
    env:
      BOARD: hardware/output/esp32p4_extreme.kicad_pcb
      OUT: kicad-ci-output
    steps:
      - uses: actions/checkout@v4

      - name: KiCad and pcbnew Python API are available
        run: |
          kicad-cli version
          python3 -c "import pcbnew; print('pcbnew', pcbnew.Version())"
          mkdir -p "$OUT"

      - name: Build the board with the pcbnew placement script (real KiCad 10 API) and DRC it
        if: hashFiles('hardware/pcbnew/esp32p4_extreme_place.py') != ''
        run: |
          python3 hardware/pcbnew/esp32p4_extreme_place.py --strict-libs \
            --fp-dir /usr/share/kicad/footprints --out "$OUT/pcbnew_built/esp32p4_extreme.kicad_pcb"
          kicad-cli pcb drc --format json --severity-all --units mm \
            --output "$OUT/pcbnew_built_drc.json" "$OUT/pcbnew_built/esp32p4_extreme.kicad_pcb"
          python3 -m tools.check_drc_report "$OUT/pcbnew_built_drc.json"

      - name: Board file present?
        id: board
        run: |
          if [ -f "$BOARD" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$BOARD not committed yet - skipping DRC/render/centroid"; fi

      - name: DRC (fails on real errors; unconnected items tolerated until routing)
        if: steps.board.outputs.exists == 'true'
        run: |
          kicad-cli pcb drc --format json --severity-all --units mm \
            --output "$OUT/drc.json" "$BOARD"
          python3 -m tools.check_drc_report "$OUT/drc.json"

      - name: 3D renders (top / bottom) with the parts' 3D models
        if: steps.board.outputs.exists == 'true'
        run: |
          # KiCad's 3D models are a separate library: fetch exactly the ones the board uses
          export KICAD10_3DMODEL_DIR="$(python3 -m tools.fetch_3d_models "$BOARD" --dest "$RUNNER_TEMP/3d")"
          for side in top bottom; do
            kicad-cli pcb render --side "$side" --width 1600 --height 1200 --quality high \
              --output "$OUT/board_$side.png" "$BOARD"
          done

      - name: Publish the renders to the 'renders' branch (main only)
        if: steps.board.outputs.exists == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/renders" && cp "$OUT"/board_*.png "$RUNNER_TEMP/renders/"
          cd "$RUNNER_TEMP/renders"
          printf 'KiCad 10 renders of %s (commit %s), published by CI.\n' "$BOARD" "$GITHUB_SHA" > README.md
          git init -q -b renders
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Renders for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" renders

      - name: Centroid / pick-and-place file for PCBWay
        if: steps.board.outputs.exists == 'true'
        run: |
          kicad-cli pcb export pos --format csv --units mm --side both \
            --use-drill-file-origin --output "$OUT/pick_and_place.csv" "$BOARD"

      - uses: actions/upload-artifact@v4
        if: always() && steps.board.outputs.exists == 'true'
        with:
          name: kicad-board-checks
          path: kicad-ci-output/
          if-no-files-found: warn

  fab:
    name: Routed board (DRC, same design as placed, Gerbers reproducible)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    env:
      PLACED: hardware/output/esp32p4_extreme.kicad_pcb
      ROUTED: hardware/output/routed/esp32p4_extreme.kicad_pcb
      OUT: kicad-fab-output
    steps:
      - uses: actions/checkout@v4

      - name: Routed board present?
        id: routed
        run: |
          mkdir -p "$OUT"
          if [ -f "$ROUTED" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ROUTED not committed yet - skipping the fabrication checks"; fi

      - name: Routed board = placed board + copper (footprints, positions, pad nets, zones)
        if: steps.routed.outputs.exists == 'true'
        run: python3 hardware/pcbnew/autoroute.py --board "$PLACED" --verify "$ROUTED"

      - name: DRC of the routed board (fully connected, no manufacturing/electrical errors)
        if: steps.routed.outputs.exists == 'true'
        run: |
          kicad-cli pcb drc --format json --severity-all --units mm \
            --output "$OUT/routed_drc.json" "$ROUTED"
          python3 -m tools.check_drc_report "$OUT/routed_drc.json" --routed

      - name: Committed Gerbers / drills / IPC-356 / pick-and-place match the routed board
        if: steps.routed.outputs.exists == 'true'
        run: |
          python3 -m tools.export_fab "$ROUTED" --check
          python3 -m tools.export_fab "$ROUTED" --out "$OUT/fab"

      - uses: actions/upload-artifact@v4
        if: always() && steps.routed.outputs.exists == 'true'
        with:
          name: fabrication-package
          path: kicad-fab-output/
          if-no-files-found: warn

  footprints:
    name: Pads exist in the real KiCad footprints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/esp32p4-footprints
          key: kicad-footprints-${{ hashFiles('hardware/lib/board_spec.py') }}
          restore-keys: kicad-footprints-

      - name: Cross-check every used pad against gitlab.com/kicad/libraries/kicad-footprints
        run: python -m hardware.skidl.check_footprints
